{

<style>
  :root {
    --accent-glow-color: rgba(136, 177, 255, 0.5);
    --accent-secondary-glow-color: rgba(0, 87, 255, 0.4);
    --white-glow-color: rgba(255, 255, 255, 0.3);
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: #00091B;
    overflow-x: hidden;
    /* Disable pull-to-refresh on mobile */
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    /* Prevent bounce scrolling on iOS */
    position: fixed;
    width: 100%;
    height: 100%;
  }
  
  /* Re-enable scrolling for main content */
  #root {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .nebula-background {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: -2;
    overflow: hidden;
  }
  .noise-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><filter id="f"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23f)" opacity=".03"/></svg>');
    animation: noise-pan 10s linear infinite;
  }

  @keyframes noise-pan {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-100px, -100px); }
  }

  .text-glow {
    text-shadow: 0 0 8px var(--white-glow-color), 0 0 16px var(--white-glow-color);
  }
  .text-glow-accent {
    text-shadow: 0 0 12px var(--accent-glow-color);
  }
  
  .bg-gradient-radial {
    background: radial-gradient(circle, var(--tw-gradient-stops));
  }
  
  /* Masonry layout for project list - optimized for mobile */
  .masonry-grid {
    column-count: 1;
    column-gap: 1rem;
    /* Improve mobile performance */
    will-change: auto;
    transform: translateZ(0);
  }
  @media (min-width: 768px) {
    .masonry-grid {
      column-count: 2;
      column-gap: 2rem;
    }
  }
  @media (min-width: 1024px) {
    .masonry-grid {
      column-count: 3;
    }
  }
  .masonry-item {
    break-inside: avoid;
    margin-bottom: 1rem;
    display: inline-block;
    width: 100%;
    /* Optimize for mobile scrolling */
    will-change: auto;
    transform: translateZ(0);
  }
  
  /* Smooth scrolling for mobile */
  * {
    -webkit-overflow-scrolling: touch;
  }
  
  /* Prevent touch callouts and selections that can interfere with scrolling */
  * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  
  /* Allow text selection in input fields */
  input, textarea, [contenteditable] {
    -webkit-user-select: text;
    -khtml-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    user-select: text;
  }

  /* Horizontal Marquee Animation for Landing Page */
  @keyframes scroll-left {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
  }

  @keyframes scroll-right {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
  }

  .marquee-row {
      width: 100%;
      display: flex;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
  }

  .marquee-content {
      display: flex;
      flex-shrink: 0;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
  }

  .animate-scroll-left {
      animation-name: scroll-left;
  }

  .animate-scroll-right {
      animation-name: scroll-right;
  }

  .marquee-row:hover .marquee-content {
      animation-play-state: paused;
  }

  /* Additional mobile scroll optimizations */
  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
  }

  /* Prevent zoom on double tap */
  * {
    touch-action: manipulation;
  }

  /* Optimize scrolling performance */
  .masonry-grid,
  .masonry-item,
  .project-card {
    backface-visibility: hidden;
    perspective: 1000px;
  }

  /* Reduce motion for users who prefer it */
  @media (prefers-reduced-motion: reduce) {
    .masonry-grid,
    .masonry-item {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

</head>
  <body>
    <div class="nebula-background"></div>
    <div class="noise-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
